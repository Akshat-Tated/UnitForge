services:
  - type: web
    name: unitforge-api
    runtime: docker
    dockerfilePath: ./orchestrator/Dockerfile
    dockerContext: ./orchestrator
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UNITFORGE_DEV_MODE
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERVER_PORT
        value: 8080
